services:
  identity-postgres:
    image: postgres:16
    container_name: identity-postgres
    restart: always
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - identity_pg_data:/var/lib/postgresql/data

  assessment-postgres:
    image: postgres:16
    container_name: assessment-postgres
    restart: always
    environment:
      POSTGRES_DB: assessment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - assessment_pg_data:/var/lib/postgresql/data

  monitoring-postgres:
    image: postgres:16
    container_name: monitoring-postgres
    restart: always
    environment:
      POSTGRES_DB: monitoring_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - monitoring_pg_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7
    container_name: lms-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  identity-service:
    build:
      context: ./identity-service
    container_name: identity-service
    restart: always
    depends_on:
      - identity-postgres
    environment:
      PORT: 4001
      NODE_ENV: development
      APP_NAME: identity-service
      API_PREFIX: /api/v1
      JWT_SECRET: change_this_super_secret_key
      JWT_EXPIRES_IN: 1d
      DB_HOST: identity-postgres
      DB_PORT: 5432
      DB_NAME: identity_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSL: "false"
      DATABASE_URL: ""
      SUPERADMIN_FIRST_NAME: Super
      SUPERADMIN_LAST_NAME: Admin
      SUPERADMIN_EMAIL: superadmin@lms.com
      SUPERADMIN_USERNAME: superadmin
      SUPERADMIN_PASSWORD: Super@12345
    ports:
      - "4001:4001"

  homework-assessment-service:
    build:
      context: ./homework-assessment-service
    container_name: homework-assessment-service
    restart: always
    depends_on:
      - assessment-postgres
    environment:
      APP_NAME: homework-assessment-service
      APP_ENV: development
      API_V1_PREFIX: /api/v1
      PORT: 4002
      POSTGRES_SERVER: assessment-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: assessment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DATABASE_URL: ""
      IDENTITY_SERVICE_BASE_URL: http://identity-service:4001
      IDENTITY_VERIFY_ENDPOINT: /api/v1/auth/verify
      IDENTITY_TIMEOUT_SECONDS: 10
      ACADEMIC_SERVICE_BASE_URL: http://host.docker.internal:4003
      ACADEMIC_TIMEOUT_SECONDS: 10
      ACADEMIC_VALIDATION_ENABLED: "false"
      UPLOAD_DIR: uploads
      MAX_FILE_SIZE_MB: 10
    ports:
      - "4002:4002"

  lms-learning-materials:
    build:
      context: ./Learning-Materials
    container_name: lms-learning-materials
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      APP_NAME: learning-materials-service
      APP_VERSION: 1.0.0
      DEBUG: "true"
      LOG_LEVEL: INFO
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB_NAME: lms_learning_materials
      JWT_SECRET: dev-secret-change-in-production
      JWT_ALGORITHM: HS256
      ENABLE_AGENT_FEATURES: "true"
      EVENT_PUBLISHER: log
      HOST: 0.0.0.0
      PORT: 4004
    ports:
      - "4004:4004"

  academic-lms-backend:
    build:
      context: ./academic-lms/academic-lms-backend
    container_name: academic-lms-backend
    restart: always
    depends_on:
      - mongodb
    environment:
      PORT: 4003
      NODE_ENV: development
      CLIENT_URL: http://localhost:5173
      MONGO_URI: mongodb://mongodb:27017/academic_lms
      JWT_SECRET: academic-dev-secret
      JWT_EXPIRES_IN: 1d
    ports:
      - "4003:4003"

  communication-student-support-service:
    build:
      context: ./communication-student-support-service
    container_name: communication-student-support-service
    restart: always
    environment:
      PORT: 4005
      APP_ENV: development
    ports:
      - "4005:4005"

  lms-monitoring-service:
    build:
      context: ./lms_monitoring_service
    container_name: lms-monitoring-service
    restart: always
    depends_on:
      - monitoring-postgres
    environment:
      APP_NAME: monitoring-administration-service
      APP_ENV: development
      API_V1_PREFIX: /api/v1
      PORT: 4007
      POSTGRES_SERVER: monitoring-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: monitoring_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DATABASE_URL: ""
    ports:
      - "4007:4007"

  lms-api-gateway:
    build:
      context: ./api_gateway
    container_name: lms-api-gateway
    restart: always
    depends_on:
      - identity-service
      - homework-assessment-service
      - lms-learning-materials
      - academic-lms-backend
      - communication-student-support-service
      - lms-monitoring-service
    environment:
      APP_NAME: lms-api-gateway
      APP_VERSION: 1.0.0
      APP_ENV: development
      HOST: 0.0.0.0
      PORT: 8080
      PROXY_TIMEOUT_SECONDS: 30
      IDENTITY_SERVICE_URL: http://identity-service:4001
      HOMEWORK_SERVICE_URL: http://homework-assessment-service:4002
      LEARNING_MATERIALS_SERVICE_URL: http://lms-learning-materials:4004
      MONITORING_SERVICE_URL: http://lms-monitoring-service:4007
      ACADEMIC_SERVICE_URL: http://academic-lms-backend:4003
      GROUP_SERVICE_URL: http://host.docker.internal:4006
      COMMUNICATION_SERVICE_URL: http://communication-student-support-service:4005
    ports:
      - "8080:8080"

volumes:
  identity_pg_data:
  assessment_pg_data:
  monitoring_pg_data:
  mongo_data:
