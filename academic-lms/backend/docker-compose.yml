services:
  mongodb:
    image: mongo:7
    container_name: academic-lms-mongodb
    restart: unless-stopped
    volumes:
      - academic_mongo_data:/data/db

  academic-lms-backend:
    build: .
    container_name: academic-lms-backend
    restart: always
    depends_on:
      - mongodb
    environment:
      PORT: ${PORT:-4003}
      NODE_ENV: ${NODE_ENV:-development}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/academic_lms}
      JWT_SECRET: ${JWT_SECRET:-academic-dev-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
    ports:
      - "4003:4003"
    command: npm start

volumes:
  academic_mongo_data:
