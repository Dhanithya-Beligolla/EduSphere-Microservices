services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - group_mongo_data:/data/db

  group-activities-service:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - mongodb
    ports:
      - "4006:4006"
    env_file:
      - .env
    environment:
      MONGODB_URL: mongodb://mongodb:27017
    restart: unless-stopped

volumes:
  group_mongo_data: